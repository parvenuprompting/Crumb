name: Crumb
options:
  bundleIdPrefix: nl.tiendo
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: VJ9D2C765N
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.10"
targets:
  Crumb:
    type: application
    platform: macOS
    sources:
      - Crumb
      - Core
    dependencies:
      - sdk: libsqlite3.tbd
      - target: CrumbAgent
    postBuildScripts:
      - name: Embed CrumbAgent
        inputFiles:
          - "$(BUILT_PRODUCTS_DIR)/CrumbAgent"
        outputFiles:
          - "$(TARGET_BUILD_DIR)/$(FULL_PRODUCT_NAME)/Contents/MacOS/CrumbAgent"
        script: |
          mkdir -p "${TARGET_BUILD_DIR}/${FULL_PRODUCT_NAME}/Contents/MacOS"
          cp -f "${BUILT_PRODUCTS_DIR}/CrumbAgent" "${TARGET_BUILD_DIR}/${FULL_PRODUCT_NAME}/Contents/MacOS/CrumbAgent"
    info:
      path: Crumb/Info.plist
      properties:
        CFBundleDisplayName: Crumb
        CFBundleIconFile: AppIcon
        LSUIElement: false
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.tiendo.crumb
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
  CrumbAgent:
    type: tool
    platform: macOS
    sources:
      - Agent
      - Core
    dependencies:
      - sdk: libsqlite3.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.tiendo.crumb.agent
        PRODUCT_NAME: CrumbAgent
  CrumbTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
    dependencies:
      - target: Crumb
schemes:
  Crumb:
    build:
      targets:
        Crumb: all
        CrumbAgent: all
        CrumbTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CrumbTests
